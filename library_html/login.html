<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - SmartShelf</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/auth.css">
  <script>var ROOT = '';</script>
</head>
<body>
  <div class="center">
    <div class="card">
      <div class="logo">📚</div>
      <h2>SmartShelf</h2>
      <p class="sub">Your college library, organized.</p>

      <div class="tabs">
        <button type="button" id="tabStudent" class="active">🎓 Student</button>
        <button type="button" id="tabLibrarian">📒 Librarian</button>
      </div>

      <form id="loginForm" autocomplete="on">
        <label for="username">Username</label>
        <input id="username" placeholder="Enter your username" required>
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Enter your password" required>
        <button class="btn btn-primary" id="loginBtn" type="submit">Login as Student</button>
        <div id="msg" class="msg"></div>
      </form>

      <div class="demo" id="demo">Demo login: <b id="demoText">student / student123</b> (tap to autofill)</div>

      <!-- shown only on the Student tab -->
      <p class="switch" id="registerLink">New user? <a href="register.html">Register here</a></p>
      <a class="back" href="index.html">← Back to home</a>
    </div>
  </div>
  <script src="js/db.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
